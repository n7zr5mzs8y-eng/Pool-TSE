<title>POOL TSÉ...</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap');
:root{
  --bg:#04060c; --bg2:#090d18;
  --card:rgba(22,30,54,.45); --card2:rgba(30,42,70,.55); --line:rgba(255,255,255,.15);
  --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.13);
  --txt:#f2f5ff; --dim:#8b97b8; --acc:#3d8bff; --acc2:#6e4dff; --ok:#2fe6a2; --warn:#ffc14d; --bad:#ff5c5c; --deap:#b48bff;
  --disp:'Barlow Condensed',-apple-system,'Segoe UI',sans-serif;
  /* ===== Couleurs d'équipe (franchises) ===== */
  --bruno:#e0142a;  --bruno-1:#f01e30;  --bruno-2:#7d0d16;   /* Red Wings   – rouge (logo) */
  --fred:#2f9fdb;   --fred-1:#3fb0e8;   --fred-2:#0a4f8f;    /* Nordiques   – bleu (logo) */
  --steve:#f4600f;  --steve-1:#ff6a1f;  --steve-2:#04173f;   /* Oilers      – orange/marine (logo) */
  --giglio:#f2b21e; --giglio-1:#ffca3a; --giglio-2:#0d7d3c;  /* North Stars – or/vert (logo) */
  --marc:#10b45f;   --marc-1:#16c86e;   --marc-2:#12386f;    /* Whalers     – vert/bleu (logo) */
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:15px;overscroll-behavior-y:contain}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom));position:relative;min-height:100vh;background:radial-gradient(120% 90% at 50% -15%,#0c1226 0%,#060911 55%,#03040a 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 0%,transparent 42%,rgba(120,150,255,.05) 50%,transparent 58%,transparent 100%)}
a{color:var(--acc);text-decoration:none}
/* ===== Fond « lumières d'aréna » (blobs très subtils aux couleurs des équipes) ===== */
.lm-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(78px) saturate(135%);opacity:.34;pointer-events:none}
.lm-bg span{position:absolute;display:block;width:48vw;height:48vw;border-radius:42% 58% 63% 37%/45% 38% 62% 55%;mix-blend-mode:screen;will-change:transform,border-radius;animation:morph 26s ease-in-out infinite alternate,drift 34s ease-in-out infinite alternate}
.lm-bg span:nth-child(1){top:-10%;left:-12%;background:linear-gradient(135deg,var(--bruno-1),var(--bruno-2));animation-delay:0s,-4s}
.lm-bg span:nth-child(2){top:2%;right:-16%;background:linear-gradient(135deg,var(--steve-1),var(--steve-2));animation-delay:-3s,-9s}
.lm-bg span:nth-child(3){bottom:-14%;left:-8%;background:linear-gradient(135deg,var(--marc-1),var(--marc-2));animation-delay:-7s,-2s}
.lm-bg span:nth-child(4){bottom:-8%;right:-12%;background:linear-gradient(135deg,var(--giglio-1),var(--giglio-2));animation-delay:-10s,-13s}
.lm-bg span:nth-child(5){top:34%;left:26%;width:40vw;height:40vw;background:linear-gradient(135deg,var(--fred-1),var(--fred-2));animation-delay:-13s,-6s}
@keyframes morph{0%{border-radius:42% 58% 63% 37%/45% 38% 62% 55%}50%{border-radius:63% 37% 41% 59%/58% 63% 37% 42%}100%{border-radius:38% 62% 55% 45%/63% 41% 59% 37%}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(4vw,3vh) scale(1.09)}100%{transform:translate(-3vw,-2vh) scale(.95)}}
@media (prefers-reduced-motion:reduce){.lm-bg span{animation:none}}
header{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,rgba(8,12,24,.92),rgba(5,8,16,.78));backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--bruno),var(--steve),var(--giglio),var(--marc),var(--fred));opacity:.75}
header h1{display:inline-block;font-family:var(--disp);font-size:22px;font-weight:900;font-style:italic;letter-spacing:1.5px;text-transform:uppercase;color:#fff;background:linear-gradient(100deg,var(--acc),var(--acc2));padding:3px 18px;text-shadow:0 1px 4px rgba(0,0,0,.45);box-shadow:0 4px 18px rgba(61,139,255,.35)}
header .sub{font-size:11px;color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
.hbtn{background:var(--glass2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.2s}
.hbtn:active{transform:scale(.94)}
#btnRefresh{margin-left:auto}
#btnRefresh.loading{opacity:.5;pointer-events:none}
#btnAdmin.on{border-color:var(--warn);color:var(--warn);box-shadow:0 0 14px rgba(255,193,77,.25)}
.wrap{padding:12px;max-width:760px;margin:0 auto}
.chips{display:flex;gap:0;overflow-x:auto;padding:2px 6px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 20px;border-radius:0;background:none;border:none;font-family:var(--disp);font-weight:700;font-size:14.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);transition:.2s}
.chip:active{transform:scale(.95)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(100deg,var(--acc),var(--acc2));box-shadow:0 4px 18px rgba(61,139,255,.4);text-shadow:0 1px 3px rgba(0,0,0,.45)}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px;backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);box-shadow:0 10px 34px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(140,170,255,.4),transparent);pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center;backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.kpi .v{font-family:var(--disp);font-size:22px;font-weight:900;font-style:italic;letter-spacing:.5px}
.kpi .l{font-size:10px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:1.2px}
.capbar{height:9px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.capbar>div{height:100%;box-shadow:0 0 12px rgba(61,139,255,.35)}
.sec{margin:16px 0 7px;display:flex;align-items:baseline;gap:8px;background:linear-gradient(100deg,rgba(61,139,255,.3),rgba(110,77,255,.12) 65%,transparent);padding:7px 18px}
.sec h2{font-family:var(--disp);font-size:16px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:1.8px;color:#dde6ff}
.sec .cnt{font-size:11px;color:var(--dim);letter-spacing:.4px}
.row{display:flex;align-items:center;gap:9px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:5px 9px;margin-bottom:6px;backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);transition:transform .15s,box-shadow .2s;box-shadow:0 3px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.13)}
.row:active{transform:scale(.99)}
.row.counted{border-left:3px solid var(--ok);box-shadow:inset 4px 0 14px -8px var(--ok),0 3px 14px rgba(0,0,0,.3)}
.row.bench{opacity:.5}
.row.deapRow{border-left:3px solid var(--deap)}
.row.pickable{border-style:dashed;cursor:pointer}
.row .rank{width:22px;text-align:center;font-family:var(--disp);font-size:14px;color:var(--dim);font-weight:800;font-style:italic}
.row .who{flex:1;min-width:0}
.row .who .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.row .who .nm a{color:var(--txt)}
.row .who .meta{font-size:11px;color:var(--dim);margin-top:1px}
.row .st{text-align:right;font-size:11.5px;color:var(--dim);line-height:1.35;white-space:nowrap}
.row .pts{width:56px;text-align:right}
.row .pts .p{font-family:var(--disp);font-size:21px;font-weight:900;font-style:italic;letter-spacing:.5px}
.row .pts .s{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.badge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:3px;margin-left:5px;vertical-align:1px;text-transform:uppercase;letter-spacing:.5px}
.b-warn{background:#3a2c10;color:var(--warn)}
.b-deap{background:#2c2145;color:var(--deap)}
.b-ok{background:#0f3524;color:var(--ok)}
.rankrow{display:flex;align-items:center;gap:12px;padding:13px 10px;border-bottom:1px solid var(--line)}
.rankrow:last-child{border-bottom:none}
.rankrow .pos{font-family:var(--disp);font-size:26px;font-weight:900;font-style:italic;width:30px;text-align:center}
.rankrow .bar{height:7px;border-radius:3px;margin-top:5px;background:rgba(0,0,0,.45);overflow:hidden}
.rankrow .bar>div{height:100%;box-shadow:0 0 14px rgba(255,255,255,.18)}
.rankrow .tp{font-family:var(--disp);font-size:26px;font-weight:900;font-style:italic;text-align:right;letter-spacing:.5px}
.rankrow .cap{font-size:11px;color:var(--dim);text-align:right}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;background:linear-gradient(0deg,rgba(4,6,12,.96),rgba(8,12,24,.82));border-top:1px solid var(--line);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.tabbar button{flex:1;background:none;border:none;color:var(--dim);font-size:9.5px;font-weight:700;letter-spacing:.3px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .2s}
.tabbar button .ic{font-size:19px;line-height:1;transition:transform .2s,filter .2s}
.tabbar button.on{color:#fff}
.tabbar button.on .ic{transform:translateY(-1px) scale(1.12);filter:drop-shadow(0 0 8px rgba(61,139,255,.8))}
.tabbar button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:0 0 2px 2px;box-shadow:0 2px 10px rgba(61,139,255,.7)}
.accordion .acc-h{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--glass);border:1px solid var(--line);border-radius:0;margin-bottom:8px;font-family:var(--disp);font-weight:700;font-size:15.5px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.2s}
.accordion .acc-h:active{transform:scale(.99)}
.accordion .acc-b{display:none;padding:2px 4px 10px}
.accordion .open + .acc-b{display:block}
.tradecard{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.tradecard .tt{display:inline-block;font-family:var(--disp);font-size:12.5px;color:#dde6ff;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px;background:linear-gradient(100deg,rgba(61,139,255,.4),rgba(110,77,255,.14));padding:2px 14px}
.tradecols{display:grid;grid-template-columns:1fr 24px 1fr;gap:6px;align-items:start}
.tradecols .side{background:var(--glass2);border-radius:8px;padding:8px;border:1px solid var(--line)}
.oblq{display:inline-block;font-family:var(--disp);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:1px;font-size:15px;color:#fff;background:linear-gradient(100deg,rgba(61,139,255,.55),rgba(110,77,255,.2));padding:2px 15px}
/* ===== Bandeaux obliques : angle unique (--sk) + élargissement au survol ===== */
:root{--sk:-19deg}
header h1,.modal h3,.reg h3,.sec,.oblq,.tradecard .tt,.tradecols .side .h,.accordion .acc-h,.btn,.chip{position:relative;background:none !important;border:none;isolation:isolate}
header h1::before,.modal h3::before,.reg h3::before,.sec::before,.oblq::before,.tradecard .tt::before,.tradecols .side .h::before,.accordion .acc-h::before,.btn::before,.chip::before{content:"";position:absolute;inset:0 11px;z-index:-1;transform:skewX(var(--sk));transform-origin:center;background:var(--obg,linear-gradient(100deg,rgba(61,139,255,.5),rgba(110,77,255,.16)));border:1px solid var(--obd,transparent);transition:transform .32s cubic-bezier(.22,.9,.3,1),filter .25s,background .25s}
header h1,.modal h3,.reg h3,.sec,.oblq,.tradecard .tt,.tradecols .side .h,.accordion .acc-h,.btn,.chip{transition:letter-spacing .32s cubic-bezier(.22,.9,.3,1),color .25s}
header h1{--obg:linear-gradient(100deg,var(--acc),var(--acc2))}
.modal h3{--obg:linear-gradient(100deg,var(--acc),var(--acc2))}
.reg h3{--obg:linear-gradient(100deg,rgba(61,139,255,.85),rgba(110,77,255,.45))}
.sec{--obg:linear-gradient(100deg,rgba(61,139,255,.32),rgba(110,77,255,.1) 70%,transparent)}
.tradecard .tt{--obg:linear-gradient(100deg,rgba(61,139,255,.38),rgba(110,77,255,.12))}
.tradecols .side .h{--obg:rgba(255,255,255,.1)}
.accordion .acc-h{--obg:var(--glass);--obd:var(--line)}
.btn{--obg:var(--glass2);--obd:var(--line)}
.btn.primary{--obg:linear-gradient(100deg,var(--acc),var(--acc2));--obd:transparent;box-shadow:none}
.btn.primary::before{box-shadow:0 6px 24px rgba(78,102,255,.45)}
.chip.on::before{box-shadow:0 4px 18px rgba(61,139,255,.4)}
header h1::before{box-shadow:0 4px 18px rgba(61,139,255,.35)}
.btn.danger{--obd:#4a2430}
/* Onglets collés : parallélogrammes jointifs, sans encadré */
.chip{--obg:var(--glass);--obd:transparent}
.chip::before{inset:0 !important;transform-origin:center}
.chip.on{--obg:linear-gradient(100deg,var(--acc),var(--acc2));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.chip.on::before{z-index:-1}
.chip:hover::before{transform:skewX(var(--sk)) scaleX(1.16)}
.chips .chip+.chip{margin-left:-1px}
/* Barre de titre d'équipe : texte net, sans fond */
.tname{font-family:var(--disp);font-weight:900;font-style:italic;font-size:19px;letter-spacing:1px;text-transform:uppercase;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.tsub{font-family:var(--disp);font-weight:700;font-style:italic;font-size:16px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
header h1:hover::before,.modal h3:hover::before,.reg h3:hover::before,.sec:hover::before,.oblq:hover::before,.tradecard .tt:hover::before,.tradecols .side .h:hover::before,.accordion .acc-h:hover::before,.btn:hover::before,.chip:hover::before{transform:skewX(var(--sk)) scaleX(1.09);filter:brightness(1.18)}
header h1:hover,.modal h3:hover,.reg h3:hover,.oblq:hover,.tradecard .tt:hover,.tradecols .side .h:hover,.accordion .acc-h:hover,.btn:hover,.chip:hover{letter-spacing:2.4px;color:#fff}
.sec:hover h2{letter-spacing:2.8px;color:#fff}
@media (hover:none){header h1:hover::before,.modal h3:hover::before,.reg h3:hover::before,.sec:hover::before,.oblq:hover::before,.tradecard .tt:hover::before,.tradecols .side .h:hover::before,.accordion .acc-h:hover::before,.btn:hover::before,.chip:hover::before{transform:skewX(var(--sk))}
header h1:hover,.modal h3:hover,.reg h3:hover,.oblq:hover,.accordion .acc-h:hover,.btn:hover,.chip:hover,.sec:hover h2{letter-spacing:inherit}}
.tradecols .side .h{display:inline-block;font-family:var(--disp);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.8px;font-size:14px;margin-bottom:4px;background:rgba(255,255,255,.1);padding:1px 12px}
.tradecols .side .it{font-size:12.5px;color:var(--txt);padding:2px 0;border-bottom:1px dashed #1e2a48}
.tradecols .side .it:last-child{border-bottom:none}
.tradecols .vs{text-align:center;color:var(--dim);font-family:var(--disp);font-weight:900;font-style:italic;padding-top:14px;font-size:13px}
.reg h3{display:inline-block;font-family:var(--disp);font-size:15.5px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:1px;color:#fff;background:linear-gradient(100deg,rgba(61,139,255,.85),rgba(110,77,255,.5));padding:3px 16px;margin:16px 0 6px}
.reg p{font-size:13.5px;color:#c3cfec;line-height:1.55;margin-bottom:8px}
.btn{display:block;width:100%;background:var(--glass2);border:1px solid var(--line);border-radius:0;color:var(--txt);padding:13px;font-family:var(--disp);font-size:15.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-top:9px;text-align:center;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.18s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(100deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 6px 24px rgba(78,102,255,.45)}
.btn.danger{color:var(--bad);border-color:#4a2430}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.modal-bg.show{display:flex}
.modal{background:linear-gradient(180deg,rgba(24,33,58,.78),rgba(12,17,32,.86));border:1px solid var(--line);border-top:2px solid rgba(160,185,255,.4);border-top-left-radius:22px;border-top-right-radius:22px;width:100%;max-width:760px;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);box-shadow:0 -14px 60px rgba(0,0,0,.65)}
.modal h3{display:inline-block;font-family:var(--disp);font-size:19px;font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;color:#fff;background:linear-gradient(100deg,var(--acc),var(--acc2));padding:3px 17px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.modal .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
.modal label{display:block;font-size:11px;color:var(--dim);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.8px}
.modal input,.modal select,.modal textarea{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:11px;font-size:15px}
.modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(61,139,255,.25)}
.modal input[type=checkbox]{width:auto;margin-right:6px}
.checklist{max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:9px;padding:8px}
.checklist label{display:flex;align-items:center;font-size:13.5px;color:var(--txt);margin:0;padding:5px 2px;border-bottom:1px dashed #1e2a48;text-transform:none;letter-spacing:0}
.checklist label:last-child{border-bottom:none}
.note{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.pill{display:inline-block;background:var(--glass2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:11px;color:var(--txt);margin:2px 3px 2px 0}
.playtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.playtbl td,.playtbl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.playtbl th{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px}
.playtbl td.r,.playtbl th.r{text-align:right}
.empty{color:var(--dim);text-align:center;padding:30px 10px;font-size:13px;line-height:1.6}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(13,20,38,.92);border:1px solid rgba(61,139,255,.4);color:var(--txt);padding:11px 18px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 18px rgba(61,139,255,.15)}
/* ===== Accents d'équipe (tuiles de choix / séries) ===== */
.row.team{border-left:4px solid transparent}
.teamtile{position:relative;overflow:hidden}
.teamtile::before{content:"";position:absolute;inset:0;z-index:0;opacity:.16;pointer-events:none;background:var(--tg,transparent)}
.teamtile>*{position:relative;z-index:1}
.tchip{display:inline-block;padding:2px 11px;border-radius:0;font-family:var(--disp);font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.lmedal{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12.5px;font-weight:900;color:#efe9dc;border:1px solid rgba(255,255,255,.16);box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.14);vertical-align:middle}
.lmedal.m4{background:linear-gradient(135deg,#9a7a4a,#4a3620)}
.lmedal.m5{background:linear-gradient(135deg,#6b7280,#33383f);color:#cfd3d8}
.ac-box:not(:empty){background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:9px;margin-top:4px;max-height:230px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fa-opt{padding:9px 11px;border-bottom:1px dashed rgba(255,255,255,.08);cursor:pointer;font-size:14px}
.fa-opt:last-child{border-bottom:none}
.fa-opt:active{background:rgba(255,255,255,.08)}
.toast.show{opacity:1}
/* ===== Cartes Paspire Deck (format portrait, cadre foil commun) ===== */
.mug{position:relative;flex:0 0 auto;border-radius:6px;overflow:hidden;padding:2.5px 2.5px 0;background:linear-gradient(130deg,#f7e7b0,#caa64b 30%,#fdf6d8 48%,#b8923d 65%,#e8c268 100%);box-shadow:0 5px 18px rgba(232,194,104,.32),0 2px 8px rgba(0,0,0,.5);display:flex;flex-direction:column}
.mugin{position:relative;flex:1;border-radius:4px;overflow:hidden;display:block}
.mug img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
.mugin::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,transparent 28%,rgba(255,255,255,.42) 43%,rgba(255,255,255,.1) 51%,transparent 62%);pointer-events:none;z-index:2}
.mugfb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.mugfb svg{width:60%;height:60%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.mugbrand{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:.3em;padding:.28em 0 .32em;font-family:var(--disp);font-weight:800;font-style:italic;letter-spacing:.1em;color:#4a3410;text-transform:uppercase;white-space:nowrap;overflow:hidden;line-height:1}
/* Petits écrans : on retire les cartes des rangées pour gagner de la largeur */
@media (max-width:430px){
  .row .mug{display:none}
  .row{gap:8px;padding:5px 8px}
  .row .who .nm{font-size:14px}
}
.mugbrand b{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:2px;background:#3d2c0c;color:#f5dfa0;font-size:.92em;font-weight:900;letter-spacing:0;transform:skewX(var(--sk))}

</style>
</head>

const REGLES = ["Pool HM ( 100 millions )", "Règles de base", "Chaque participant débute la saison avec obligatoirement 25 joueurs (minimum 12 attaquants + 6 défenseurs + 2 gardiens). Les 12 meilleurs attaquants, les 6 meilleurs défenseurs et les 2 meilleurs gardiens (total de 20) comptent pour le classement.", "Ainsi, si un joueur se blesse pour 4 mois, il sera remplacé automatiquement par un autre lorsque celui-ci aura accumulé plus de point que le blessé.", "De plus, 5 joueurs sous contrat (même s'ils ne jouent pas dans la LNH) qui resteront dans un bassin à part nommé DEAP POOL. Ils doivent obligatoirement être repêché dans la LNH Ces joueurs ne comptent ni sur votre masse salariale ni sur votre alignement de 25 joueurs.", "Cependant, lorsqu'un attaquant ou défenseur DEAP POOL aura joué entre 45-50 parties de saison régulière en carrière dans la LNH, 20 à 25 pour un gardien. À partir du drop mi-saison, il faut obligatoirement au 50e match ( 25e pour un gardien ) pour le monter dans son alignement de départ. vous serez obligé de choisir d'intégrer ce joueur dans votre lineup et supprimer un autre joueur (blessé, sous-performant…) ou bien simplement le discarter.", "Ex. Jack Hughes se trouve dans mon bassin rookie. Il reste avec New Jersey toute l'année alors à son 50e match, je dois choisir de le monter dans mon alignement et dropper Brandon Gallagher pour toujours. Ma masse salariale totale sera ajustée et les 35 points de Gallagher seront perdus. Cependant, les 40 points de Hughes comptent alors mes points totaux subiront une hausse de 5.", "Ce statut demeure le même, lors d’échange. On ne peut donc pas changer ce tag pendant et immédiatement après l’échange.", "Système de pointage", "Attaquants 1 point / but", "et 1 point / passe", "Défenseurs 1.5/ but", "et 1,5 / passe", "Gardiens 3 points / victoire", "1 / défaite en fus ou prolongation", "2 / blanchissage", "Limite salariale", "Chaque participant doit respecter en tout temps la limite salariale qui est de 125 millions (2024) pour la totalité de son équipe (25 joueurs) au draft. Nous utilisons le salaire du CAP HIT sur capfriendly.com vous n'êtes pas obligé de dépenser jusqu'à la limite. Pensez au trades, laissez-vous un petit coussin!", "Échanges", "Tout échange qui respecte les règles d'éthique du pool est permis. Il faut donc respecter le nombre minimum de joueurs pour chacune des positions.", "Toutefois, il est impossible d’effectuer des échanges à 3 contre 2 ou à 4 contre 1, etc… En tout temps les participants doivent compter un nombre de 25 joueurs dans leur alignement et respecter la masse salariale.", "Il faut respecter en tout temps le nombre de joueurs, et le nombre de picks respectifs pour chacun des drafts. Il est aussi possible d'échanger des picks lors du drop du match des étoiles et pour le repêchage de septembre. Cependant, la même règle en rapport aux joueurs s'applique.", "Ex.: Si j'échange un 2e pick en septembre, je dois en recevoir un autre pour septembre peu importe le rang. Vous ne pouvez pas échanger un Pick ⭐ vs un Pick septembre. Tout doit balancer.", "Ainsi, tous les poolers auront le même nombre de choix de repêchage. De plus, les points du joueur échangé seront retirés et les points du joueur qui s'ajoutera à votre formation seront additionné en totalité.", "Ex. de trade:", "Crosby 70 points + 5e Pick septembre", "vs", "Dhalin 40 points + 2e Pick septembre", "Puisque je compte 25 joueurs dans mon alignement dont 20 qui comptent, le système prendra un des attaquants inactifs pour remplacer Crosby et Dahlin."];

function seasonId(){
  // Les totaux 2025-26 restent affichés jusqu'au début de la saison 2026-27 (1er octobre 2026)
  const d = new Date(); const y = d.getFullYear(); const m = d.getMonth()+1;
  const s = m>=10 ? y : y-1;
  return s*10000 + (s+1);
}
function norm(s){
  return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .toLowerCase().replace(/[.''-]/g,"").replace(/\s+/g," ").trim();
}
const NHL_BASE = (location.protocol==="http:"||location.protocol==="https:") ? "/nhl" : "https://api.nhle.com/stats/rest/en";
async function fetchAll(kind, gameType){
  const sid = seasonId(); const rows = []; let start = 0, total = 1;
  const gt = gameType || 2;   // 2 = saison régulière, 3 = séries
  while(start < total && start < 1500){
    const url = `${NHL_BASE}/${kind}/summary?limit=100&start=${start}&cayenneExp=`+encodeURIComponent(`seasonId=${sid} and gameTypeId=${gt}`);
    const r = await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json(); total = j.total; rows.push(...j.data); start += 100;
    if(!j.data.length) break;
  }
  return rows;
}
async function refreshStats(manual){
  const sid0 = seasonId();
  if(manual) pullSync();
  const btn = document.getElementById("btnRefresh");
  btn.classList.add("loading"); btn.textContent = "…";
  try{
    const [sk, gl] = await Promise.all([fetchAll("skater"), fetchAll("goalie")]);
    const idx = {};
    function put(cat, name, obj){
      const parts = norm(name).split(" ");
      const last = parts.slice(1).join(" ") || parts[0];
      const k = cat+"|"+last;
      (idx[k] = idx[k]||[]).push(obj);
    }
    sk.forEach(r=>{
      const cat = (r.positionCode==="D") ? "D" : "F";
      put(cat, r.skaterFullName, {n:norm(r.skaterFullName), gp:r.gamesPlayed, g:r.goals, a:r.assists, team:r.teamAbbrevs, pid:r.playerId});
    });
    gl.forEach(r=>{
      put("G", r.goalieFullName, {n:norm(r.goalieFullName), gp:r.gamesPlayed, w:r.wins, so:r.shutouts, otl:r.otLosses, team:r.teamAbbrevs, pid:r.playerId});
    });
    // Univers « agents libres » : tous les joueurs de la LNH cette saison
    const fa = [];
    sk.forEach(r=>{ const pos=(r.positionCode==="D")?"D":"F"; const raw=(r.goals||0)+(r.assists||0); fa.push({name:r.skaterFullName, pos, pts: pos==="D"?1.5*raw:raw, g:r.goals||0, a:r.assists||0, gp:r.gamesPlayed||0, team:r.teamAbbrevs||"", pid:r.playerId}); });
    gl.forEach(r=>{ fa.push({name:r.goalieFullName, pos:"G", pts:3*(r.wins||0)+2*(r.shutouts||0)+(r.otLosses||0), w:r.wins||0, so:r.shutouts||0, otl:r.otLosses||0, gp:r.gamesPlayed||0, team:r.teamAbbrevs||"", pid:r.playerId}); });
    S.faList = fa; S.faDate = new Date().toISOString();
    const res = {};
    const sumRows = rows => rows.reduce((acc,c)=>({gp:(acc.gp||0)+(c.gp||0), g:(acc.g||0)+(c.g||0), a:(acc.a||0)+(c.a||0), w:(acc.w||0)+(c.w||0), so:(acc.so||0)+(c.so||0), otl:(acc.otl||0)+(c.otl||0), team:c.team, n:c.n, pid:c.pid||acc.pid}), {});
    const firstOf = s => (s.split(" ")[0]||"");
    allPlayers().forEach(p=>{
      const pn = norm(p.name); const parts = pn.split(" ");
      const last = parts.slice(1).join(" ") || parts[0]; const first = parts[0];
      const cands = idx[p.pos+"|"+last] || [];
      const exact = cands.filter(c=>c.n===pn);                 // nom complet exact (peut être 2 lignes si échangé)
      const firstFull = cands.filter(c=>firstOf(c.n)===first); // même prénom complet
      const firstInit = cands.filter(c=>firstOf(c.n)[0]===first[0]); // même initiale de prénom
      let m = null;
      if(exact.length) m = sumRows(exact);                     // additionne les lignes (Vancouver + Minnesota, etc.)
      else if(cands.length===1 && firstInit.length===1) m = cands[0]; // nom de famille unique + initiale ok
      else if(firstFull.length) m = sumRows(firstFull);        // même prénom exact
      else if(firstInit.length===1) m = firstInit[0];          // une seule initiale de prénom correspondante
      // sinon: aucun match sûr → on n'assigne pas d'homonyme (le joueur garde ses totaux intégrés)
      if(m) res[p.id] = m;
    });
    S.stats = res; S.statsSeason = sid0; S.statsDate = new Date().toISOString(); takeSnapshot(); save();
    render();
    if(manual) toast("Points mis à jour ✓");
  }catch(e){
    if(manual) toast("Connexion requise pour actualiser — totaux 2025-26 affichés");
  }
  btn.classList.remove("loading"); btn.textContent = "↻";
}
function statOf(p){
  if(seasonId() === SNAP_SEASON) return p.snap || null; // saison terminée : totaux finaux intégrés (non écrasés par le direct)
  if(S.stats && S.statsSeason === seasonId() && S.stats[p.id]) return S.stats[p.id];
  return null; // nouvelle saison, aucune donnée encore = remise à zéro
}
function poolPts(p){
  const s = statOf(p); if(!s) return 0;
  if(p.pos==="F") return (s.g||0)+(s.a||0);
  if(p.pos==="D") return 1.5*((s.g||0)+(s.a||0));
  return 3*(s.w||0)+2*(s.so||0)+(s.otl||0);
}
function statLine(p){
  const s = statOf(p);
  if(!s) return "<span style='opacity:.5'>—</span>";
  if(p.pos==="G") return `${s.w||0} V · ${s.so||0} BL · ${s.otl||0} DP<br>${s.gp||0} PJ`;
  return `${s.g||0} B · ${s.a||0} P · ${(s.g||0)+(s.a||0)} Pts<br>${s.gp||0} PJ`;
}

/* ================== HELPERS ================== */
function money(v){
  if(v===0||v==null) return "—";
  return (v/1000000).toLocaleString("fr-CA",{minimumFractionDigits:v%1000000===0?0:2,maximumFractionDigits:3})+" M$";
}
function teamCalc(pooler){
  if(pooler===GHOST) return ghostCalc();
  const ps = allPlayers().filter(p=>p.pooler===pooler);
  const act = ps.filter(p=>!p.deap), deap = ps.filter(p=>p.deap);
  const by = c => act.filter(p=>p.pos===c).sort((a,b)=>poolPts(b)-poolPts(a));
  const F = by("F"), D = by("D"), G = by("G");
  const counted = new Set([...F.slice(0,12),...D.slice(0,6),...G.slice(0,2)].map(p=>p.id));
  let pts = 0; act.forEach(p=>{ if(counted.has(p.id)) pts += poolPts(p); });
  const cap = act.reduce((t,p)=>t+(p.cap||0),0);
  return {F,D,G,deap,act,counted,pts,cap};
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtPts(x){ return (Math.round(x*10)/10).toLocaleString("fr-CA"); }
function slugify(nm){
  return nm.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/['.]/g,"").replace(/\s+/g,"-");
}
function slugifyFT(nm){
  return nm.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g,"-");
}
function mkLinks(nm){
  return {ft:"https://frozenpool.dobbersports.com/players/"+slugifyFT(nm), ppUrl:"https://puckpedia.com/player/"+slugify(nm)};
}

/* ================== PROGRESSION (jour / semaine / mois) ================== */
function dstr(dt){ return dt.toISOString().slice(0,10); }
function takeSnapshot(){
  const today = dstr(new Date());
  const pts = {}; allPlayers().forEach(p=>pts[p.id]=poolPts(p));
  S.hist = (S.hist||[]).filter(h=>h.d!==today);
  S.hist.push({d:today, pts});
  S.hist.sort((a,b)=>a.d<b.d?-1:1);
  const cut = dstr(new Date(Date.now()-300*864e5));
  S.hist = S.hist.filter(h=>h.d>=cut);
}
function deltaOf(p, per){
  if(!S.hist || !S.hist.length) return null;
  const days = per==="j"?1 : per==="s"?7 : 30;
  const cutoff = dstr(new Date(Date.now()-days*864e5));
  let base = null;
  for(const h of S.hist){ if(h.d <= cutoff) base = h; }
  if(!base) return null;
  const prev = base.pts[p.id];
  return poolPts(p) - (prev==null?0:prev);
}
function teamDelta(pooler, t, per){
  let sum=0, any=false;
  allPlayers().filter(p=>p.pooler===pooler && t.counted.has(p.id)).forEach(p=>{
    const d = deltaOf(p, per); if(d!=null){ sum+=d; any=true; }
  });
  return any ? sum : null;
}
function periodChips(){
  const per = S.period||"total";
  const items = [["total","Total"],["j","Jour"],["s","Semaine"],["m","Mois"]];
  return `<div class="chips" style="padding-bottom:8px">`+items.map(([k,l])=>
    `<div class="chip ${per===k?'on':''}" onclick="S.period='${k}';save();render()">${l}</div>`).join("")+`</div>`;
}
function ptsCell(p){
  const per = S.period||"total";
  if(per==="total") return `<div class="pts"><div class="p">${fmtPts(poolPts(p))}</div><div class="s">pts pool</div></div>`;
  const d = deltaOf(p, per);
  const lbl = {j:"jour", s:"7 jours", m:"30 jours"}[per];
  const v = d==null ? "—" : (d>0?"+":"")+fmtPts(d);
  const col = d>0 ? "var(--ok)" : (d<0 ? "var(--bad)" : "var(--txt)");
  return `<div class="pts"><div class="p" style="color:${col}">${v}</div><div class="s">${lbl}</div></div>`;
}

/* ================== SYNCHRONISATION (jsonblob.com) ================== */
const SYNC_HOSTED = (location.protocol==="http:"||location.protocol==="https:");
const SYNC_PROVIDERS = {
  ec: { create: SYNC_HOSTED?"/bin":"https://json.extendsclass.com/bin", item:id=>(SYNC_HOSTED?"/bin/":"https://json.extendsclass.com/bin/")+id },
  jb: { create: SYNC_HOSTED?"/blob":"https://jsonblob.com/api/jsonBlob", item:id=>(SYNC_HOSTED?"/blob/":"https://jsonblob.com/api/jsonBlob/")+id }
};
function syncURL(){ const s=S.sync||{}; const p=SYNC_PROVIDERS[s.prov]; return (p&&s.id)?p.item(s.id):null; }
function syncCode(){ const s=S.sync||{}; return s.id?((s.prov||"jb")+"~"+s.id):""; }
let pushTimer = null;
function adminData(){ return {over:S.over, added:S.added, picks:S.picks, userTrades:S.userTrades, cap:S.cap, bracketOver:S.bracketOver||{}, seriesPool:S.seriesPool||null, leftPlayers:S.leftPlayers||{}, seriesArchive:S.seriesArchive||[], extraDrafts:S.extraDrafts||[], pickReassign:S.pickReassign||{}, rookies:S.rookies||[], brkPicks:S.brkPicks||{}, brkConf:S.brkConf||null, spConf:S.spConf||null, ghost:S.ghost||null, rulesText:S.rulesText||null}; }
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(pushSync, 1500); }
async function pushSync(){
  const url = syncURL(); if(!url) return;
  const rev = Date.now();
  try{
    const r = await fetch(url, {method:"PUT",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({rev, data:adminData()})});
    if(r.ok){ S.lastRev = rev; try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
  }catch(e){}
}
async function pullSync(){
  const url = syncURL(); if(!url) return;
  try{
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) return;
    const j = await r.json();
    if(j && j.rev && j.rev > (S.lastRev||0) && j.data){
      S.over = j.data.over||{}; S.added = j.data.added||[]; S.picks = j.data.picks||{};
      S.userTrades = j.data.userTrades||[]; if(j.data.cap) S.cap = j.data.cap;
      S.bracketOver = j.data.bracketOver||{}; S.seriesPool = j.data.seriesPool||null;
      S.leftPlayers = j.data.leftPlayers||{}; S.seriesArchive = Array.isArray(j.data.seriesArchive)?j.data.seriesArchive:[];
      S.extraDrafts = Array.isArray(j.data.extraDrafts)?j.data.extraDrafts:[];
      S.pickReassign = j.data.pickReassign||{}; S.rookies = Array.isArray(j.data.rookies)?j.data.rookies:[];
      S.rulesText = Array.isArray(j.data.rulesText)?j.data.rulesText:null;
      S.brkPicks = j.data.brkPicks||{}; S.brkConf = j.data.brkConf||null; S.spConf = j.data.spConf||null;
      if(j.data.ghost) S.ghost = j.data.ghost;
      S.lastRev = j.rev;
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      render(); toast("Mise à jour du pool reçue ✓");
    }
  }catch(e){}
}
async function createSync(){
  const order = ["ec","jb"]; let lastErr = "réseau";
  toast("Activation de la synchro…");
  for(const prov of order){
    try{
      const P = SYNC_PROVIDERS[prov]; const rev = Date.now();
      const r = await fetch(P.create, {method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({rev, data:adminData()})});
      if(!r.ok){ lastErr = "HTTP "+r.status; continue; }
      let id = "";
      if(prov==="ec"){ try{ const j = await r.clone().json(); id = j.id||j.Id||j._id||""; }catch(e){} }
      if(!id){ const loc = (r.headers.get("Location")||"")+" "+(r.headers.get("X-jsonblob")||"")+" "+(r.url||"");
        id = (loc.match(/bin\/([0-9a-f-]{6,})/i)||[])[1] || (loc.match(/jsonBlob\/([0-9a-f-]{8,})/i)||[])[1] || (loc.match(/[0-9a-f]{16,}[0-9a-f-]*/i)||[])[0] || ""; }
      if(!id){ try{ const t = await r.text(); id = (t.match(/[0-9a-f-]{16,}/i)||[])[0]||""; }catch(e){} }
      if(!id){ lastErr = "code introuvable"; continue; }
      S.sync = {id, prov}; S.lastRev = rev; save(); closeModal(); render();
      toast("Synchro activée ✓"); shareApp(); return;
    }catch(e){ lastErr = (e && e.message) || "réseau"; }
  }
  toast("Synchro auto impossible ("+lastErr+"). Utilise « 📋 Copier mes modifications » → coller dans iMessage → les autres « 📥 Importer ».");
}
function shareLink(){
  const base = (location.protocol==="http:"||location.protocol==="https:") ? (location.origin + location.pathname) : "";
  const code = syncCode();
  return base ? base + (code?("#sync="+code):"") : "";
}

function handleSyncHash(){
  const m = (location.hash||"").match(/sync=(?:([a-z]{2})~)?([0-9a-zA-Z_-]{6,})/i);
  if(m){ const prov=(m[1]||"jb").toLowerCase(); const id=m[2];
    if(!S.sync || S.sync.id!==id){ S.sync={id,prov}; S.lastRev=0; try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} return true; } }
  return false;
}
function setSyncId(v){
  v = (v||"").trim();
  let prov="", id="";
  const mp = v.match(/^([a-z]{2})~([0-9a-zA-Z_-]{6,})/i);
  if(mp){ prov=mp[1].toLowerCase(); id=mp[2]; }
  else { id = (v.match(/[0-9a-zA-Z_-]{6,}/)||[])[0]||""; prov = "ec"; }
  if(!id){ toast("Code invalide"); return; }
  S.sync = {id, prov}; S.lastRev = 0;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  closeModal(); pullSync(); toast("Synchro connectée ✓");
}

function pidFor(p){

  const team = ((s.team|| (c&&c.team) || p.team||"").split(/[,\s]+/).filter(Boolean).pop()||"").slice(0,3).toUpperCase();

function mugHtml(p, w, h){

const WEB_BASE = (location.protocol==="http:"||location.protocol==="https:") ? "/nhlweb" : "https://api-web.nhle.com";
/* Trouve l'identifiant LNH d'un joueur par recherche de nom */
async function searchPid(name){
  const r = await fetch(SEARCH_BASE + "/api/v1/search/player?culture=en-us&limit=8&q=" + encodeURIComponent(name));
  if(!r.ok) return null;
  const arr = await r.json();
  const exact = arr.filter(x=>norm(x.name)===norm(name) || norm(x.name).endsWith(" "+norm(name)));
  const best = exact.find(x=>x.active) || exact[0] || arr[0];
  return (best && best.playerId) ? {pid:String(best.playerId), team:(best.teamAbbrev||best.lastTeamAbbrev||"")} : null;
}
/* Demande à la LNH les URLs exactes de la photo d'action et du portrait */
async function fetchPhotos(pid){
  const r = await fetch(WEB_BASE + "/v1/player/" + pid + "/landing");
  if(!r.ok) return null;
  const j = await r.json();
  return {hero:j.heroImage||"", head:j.headshot||"", team:j.currentTeamAbbrev||""};
}
let pidsWarming = false;
async function warmPids(force){
  if(pidsWarming) return; pidsWarming = true;
  S.pids = S.pids || {};
  const todo = allPlayers().filter(p=>{
    if(!p.name) return false;
    const c = S.pids[norm(p.name)];
    return force || !c || !c.hero || !c.head;   // il manque les URLs exactes
  });
  let found = 0;
  for(const p of todo){
    try{
      const key = norm(p.name);
      let c = S.pids[key] || {};
      let pid = c.pid || pidFor(p).pid;
      if(!pid){ const s = await searchPid(p.name); if(s){ pid = s.pid; c.team = s.team; } }
      if(!pid) continue;
      c.pid = String(pid);
      const ph = await fetchPhotos(pid);
      if(ph){ c.hero = ph.hero; c.head = ph.head; if(ph.team) c.team = ph.team; }
      S.pids[key] = c; found++;
    }catch(e){}
    await new Promise(r=>setTimeout(r,110));

/* ---- Choix (joueur choisi / joueur délaissé) ---- */
function guessPooler(label){
  const map = [["fredo","Frédéric"],["frederic","Frédéric"],["steeve","Steve"],["steve","Steve"],["giglio","Giglio"],["gig","Giglio"],["marc","Marc"],["bruno","Bruno"]];
  const clean = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
  const par = label.match(/\(([^)]+)\)/);
  if(par){ const c = clean(par[1]); for(const [k,v] of map){ if(c.startsWith(k)) return v; } }
  const c = clean(label.split("(")[0]);
  for(const [k,v] of map){ if(c.startsWith(k)) return v; }
  return "Bruno";
}
function poolerOf(label){
  const map = [["fredo","Frédéric"],["frederic","Frédéric"],["steeve","Steve"],["steve","Steve"],["giglio","Giglio"],["gig","Giglio"],["marc","Marc"],["bruno","Bruno"],["brun","Bruno"]];
  const clean = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
  const par = (label||"").match(/\(([^)]+)\)/);
  if(par){ const c = clean(par[1]); for(const [k,v] of map){ if(c.startsWith(k)) return v; } }
  const c = clean((label||"").split("(")[0]);
  for(const [k,v] of map){ if(c===k || c.startsWith(k)) return v; }
  return null;
}
const POOL_ORDER = ["Steve","Frédéric","Giglio","Marc","Bruno"];
/* Ordre de repêchage = classement inversé : le pire pointeur choisit en 1er, le meilleur en dernier */
function draftOrder(){ return POOLERS.slice().sort((a,b)=> (teamCalc(a).pts||0) - (teamCalc(b).pts||0)); }
/* Propriétaire d'origine du choix = nom AVANT la parenthèse (fixe le rang, stable même si échangé) */
function pureOwner(label){ return guessPooler((label||"").split("(")[0]); }
function allDraftBlocks(){ return CHOIX.concat(S.extraDrafts||[]); }
function isDraftEditable(b){ return b.edit===true || /SEPTEMBRE/i.test(b.titre); }
function draftKey(b,rn,pi){ return b.titre+"|"+rn+"|"+pi; }
function draftFilled(b){ return b.rondes && b.rondes.length>0 && b.rondes.every(r=>r.picks.every((pk,pi)=>!!S.picks[draftKey(b,r.n,pi)])); }
function draftKind(t){ if(/SEPTEMBRE/i.test(t))return "SEPTEMBRE"; if(/[ÉE]TOILE/i.test(t))return "ÉTOILES"; return null; }
function nextSeasonLabel(t){ const m=t.match(/(\d{2})\s*-\s*(\d{2})/); if(!m)return null; const pad=n=>String(n%100).padStart(2,"0"); return pad(parseInt(m[1])+1)+"-"+pad(parseInt(m[2])+1); }
function makeBlankDraft(kind, season, rondesCount){
  const order = draftOrder();
  const rondes=[]; for(let n=1;n<=(rondesCount||5);n++){ rondes.push({n, picks:order.slice()}); }
  const note = kind==="ÉTOILES" ? "Ballottage des étoiles — touche un choix pour le remplir" : "Repêchage de septembre — touche un choix pour le remplir";
  return {titre:kind+" "+season, edit:true, open:true, note, rondes};
}
function seedDrafts(){
  if(allDraftBlocks().some(b=>b.edit && draftKind(b.titre)==="ÉTOILES")) return false;
  const sept = allDraftBlocks().find(b=>/SEPTEMBRE/i.test(b.titre));
  const season = ((sept&&sept.titre.match(/(\d{2}\s*-\s*\d{2})/))||[])[1] || "26-27";
  S.extraDrafts.push(makeBlankDraft("ÉTOILES", season.replace(/\s/g,""), 5));
  return true;
}
function ensureNextDrafts(){
  let changed=false;
  allDraftBlocks().forEach(b=>{
    if(!isDraftEditable(b) || !draftFilled(b)) return;
    const kind=draftKind(b.titre), next=nextSeasonLabel(b.titre);
    if(!kind || !next) return;
    const wanted=(kind+" "+next).toUpperCase();
    if(!allDraftBlocks().some(x=>x.titre.replace(/\s+/g," ").trim().toUpperCase()===wanted)){
      S.extraDrafts.push(makeBlankDraft(kind, next, b.rondes.length)); changed=true;
    }
  });
  return changed;
}
function draftChipBg(b){ return draftKind(b.titre)==="ÉTOILES" ? "linear-gradient(135deg,#ffd34d,#c9861a)" : "linear-gradient(135deg,#5aa9ff,#2f6fd6)"; }
function vChoix(){
  if(seedDrafts()||ensureNextDrafts()) save();
  const active = allDraftBlocks().filter(b=>isDraftEditable(b)&&!draftFilled(b));
  if(!active.length) return `<div class="empty">Tous les choix sont remplis — ils sont dans 🗄️ Archives.<br>La saison suivante apparaîtra ici automatiquement.</div>`;
  let sel = (S.choixSel && active.some(b=>b.titre===S.choixSel)) ? S.choixSel : active[0].titre;
  // Sélecteur des repêchages à venir (Septembre / Étoiles)
  let h = `<div class="chips">`+active.map(b=>{

  bloc.rondes.forEach((r,ri)=>{

    <div class="acc-b">`;
    // Rang fixé par le propriétaire d'origine (nom avant la parenthèse), stable même si le choix est échangé
    const entries = r.picks.map((pk,pi)=>({pk,pi})).sort((a,b)=> ordIx(pureOwner(a.pk)) - ordIx(pureOwner(b.pk)));
    entries.forEach(({pk,pi},idx)=>{

      h += `<div class="row ${clickable?'pickable':''}" style="padding:9px 12px;background:${pFill(who)};border:1px solid ${pBorder(who)}" ${clickable?`onclick="openPick('${key}',this.dataset.lbl,'${who}')" data-lbl="${esc(pk)}"`:""}>

        ${rec?`<div class="meta" style="color:#eaf0fb">Choisi: <b>${esc(rec.inName)}</b>${rec.outName?" · Délaissé: "+esc(rec.outName):""} (${esc(rec.team)})</div>`:""}
        </div></div>`;
    });
    h += `</div>`;
  });
  h += `</div>`;
  h += `<div class="note">Le nom entre parenthèses = détenteur du choix. Un bloc entièrement rempli passe automatiquement dans 🗄️ Archives et la saison suivante s'ouvre ici.</div>`;
  return h;
}

function poolerSlots(pooler){
  const out=[];
  allDraftBlocks().forEach(b=>{ if(!isDraftEditable(b)||draftFilled(b)) return;
    b.rondes.forEach(r=>r.picks.forEach((pk,pi)=>{ const key=draftKey(b,r.n,pi); if(S.picks[key]) return;
      const owner = S.pickReassign[key] || guessPooler(pk);
      if(owner===pooler) out.push({key, label:"Ronde "+r.n+" · "+b.titre}); }));
  });
  return out;
}
function slotLabel(key){ const p=key.split("|"); return "Ronde "+p[1]+" · "+p[0]; }

  <button class="btn primary" onclick="doTrade()">🔄 Confirmer l'échange</button>`);
  fillTrade('A'); fillTrade('B');
}
function fillTrade(side){
  const mk = (pooler, sd) => allPlayers().filter(p=>p.pooler===pooler)
    .sort((x,y)=>poolPts(y)-poolPts(x))
    .map(p=>`<label><input type="checkbox" name="tr${sd}" value="${p.id}"> ${esc(p.name)} (${p.pos}${p.deap?", Recrue":""}, ${fmtPts(poolPts(p))} pts)</label>`).join("");
  const mkP = (pooler, sd) => poolerSlots(pooler).map(x=>`<label><input type="checkbox" name="trP${sd}" value="${x.key}"> ${esc(x.label)}</label>`).join("");
  if(!side || side==='A'){ const a = document.getElementById("trA").value; document.getElementById("trAList").innerHTML = mk(a,"A") || "<div class='empty'>Aucun joueur</div>"; document.getElementById("trAPicks").innerHTML = mkP(a,"A") || "<div class='empty' style='padding:6px'>Aucun choix à venir</div>"; }
  if(!side || side==='B'){ const b = document.getElementById("trB").value; document.getElementById("trBList").innerHTML = mk(b,"B") || "<div class='empty'>Aucun joueur</div>"; document.getElementById("trBPicks").innerHTML = mkP(b,"B") || "<div class='empty' style='padding:6px'>Aucun choix à venir</div>"; }
}
function doTrade(){
  const a = document.getElementById("trA").value, b = document.getElementById("trB").value;
  if(a===b){ toast("Choisis deux équipes différentes"); return; }
  const ids = s => [...document.querySelectorAll(`input[name=tr${s}]:checked`)].map(x=>x.value);
  const pks = s => [...document.querySelectorAll(`input[name=trP${s}]:checked`)].map(x=>x.value);
  const idsA = ids("A"), idsB = ids("B"), pkA = pks("A"), pkB = pks("B");
  const txtA = document.getElementById("trAtxt").value.trim(), txtB = document.getElementById("trBtxt").value.trim();
  if(!idsA.length && !idsB.length && !pkA.length && !pkB.length && !txtA && !txtB){ toast("Échange vide"); return; }
  const all = allPlayers();
  const itemsA = idsA.map(id=>all.find(p=>p.id===id).name), itemsB = idsB.map(id=>all.find(p=>p.id===id).name);
  idsA.forEach(id=>setOver(id, {pooler:b}));
  idsB.forEach(id=>setOver(id, {pooler:a}));
  S.pickReassign = S.pickReassign||{};
  pkA.forEach(k=>{ S.pickReassign[k]=b; itemsA.push("🎯 "+slotLabel(k)); });
  pkB.forEach(k=>{ S.pickReassign[k]=a; itemsB.push("🎯 "+slotLabel(k)); });
  if(txtA) itemsA.push(txtA); if(txtB) itemsB.push(txtB);
  S.userTrades.unshift({date:new Date().toLocaleDateString("fr-CA"), a, b, itemsA, itemsB});
  S.tab = 'equipes'; S.curPooler = idsA.length ? b : a;
  save(); if(S.sync&&S.sync.id) pushSync(); closeModal(); render(); window.scrollTo(0,0);
  if(S.sync&&S.sync.id){ toast("Échange enregistré ✓ — publié aux autres poolers"); }
  else { exportData(); }
}

function brkConf(){
  return Object.assign({r1:1, r2:2, r3:3, r4:5, auto:true}, S.brkConf||{});
}
function spConf(){
  return Object.assign({nb:3, F:1, D:1.5, gV:3, gBL:2, gDP:1}, S.spConf||{});

/* Points de pronostics calculés à partir du vrai tableau de la LNH */
function brkAuto(nm){
  const b = S.nhlBracket; if(!b || !b.rounds) return null;
  const picks = ((S.brkPicks||{})[nm])||{};
  const c = brkConf();
  const par = {r1:0, r2:0, r3:0, r4:0}; let aucun = true;
  b.rounds.forEach(rd=>{
    const cle = "r"+rd.roundNumber;
    (rd.series||[]).forEach(s=>{
      const choix = picks[s.seriesLetter];
      if(!choix) return;
      aucun = false;
      if(!s.winningTeamId) return;                    // série pas terminée
      const gagnant = (s.topSeed&&s.topSeed.id===s.winningTeamId) ? s.topSeed.abbrev
                    : (s.bottomSeed&&s.bottomSeed.id===s.winningTeamId) ? s.bottomSeed.abbrev : null;
      if(gagnant && choix===gagnant) par[cle] += (c[cle]||0);
    });
  });
  return aucun ? null : par;
}
function bracketRows(){
  const auto = brkConf().auto;
  return POOLERS_BASE.map(nm=>{
    const a = auto ? brkAuto(nm) : null;
    const o = (S.bracketOver||{})[nm]||{};
    const anc = BRACKET.find(x=>(x.pooler==="Fredo"?"Frédéric":x.pooler)===nm)||{};
    const val = (k)=> a && a[k]!=null ? a[k] : (o[k]!==undefined ? o[k] : anc[k]);
    const r1=val("r1"), r2=val("r2"), r3=val("r3"), r4=val("r4");
    return {nm, r1, r2, r3, r4, auto:!!a, total:[r1,r2,r3,r4].reduce((t,v)=>t+(v||0),0)};
  });
}

async function refreshPlayoffs(manual){
  if(manual) toast("🥅 Statistiques des séries…");
  try{
    const [sk, gl] = await Promise.all([fetchAll("skater",3), fetchAll("goalie",3)]);
    const idx = {};
    sk.forEach(r=>{ const pos=(r.positionCode==="D")?"D":"F";
      idx[norm(r.skaterFullName)] = {pos, gp:r.gamesPlayed||0, g:r.goals||0, a:r.assists||0, team:r.teamAbbrevs||""}; });
    gl.forEach(r=>{ idx[norm(r.goalieFullName)] = {pos:"G", gp:r.gamesPlayed||0, w:r.wins||0, so:r.shutouts||0, otl:r.otLosses||0, team:r.teamAbbrevs||""}; });
    S.poStats = idx; S.poDate = new Date().toISOString();
    // recalcule les points des joueurs du pool des séries
    ensureSP();
    let maj = 0;
    S.seriesPool.forEach(r=>{
      const s = idx[norm(r.joueur)];
      if(!s) return;
      const pos = (r.pos||s.pos||"F").toUpperCase();
      const c = spConf();
      const pts = pos==="G" ? c.gV*(s.w||0)+c.gBL*(s.so||0)+c.gDP*(s.otl||0)
                : pos==="D" ? c.D*((s.g||0)+(s.a||0))
                            : c.F*((s.g||0)+(s.a||0));
      const stats = pos==="G" ? `${s.w||0} V · ${s.so||0} BL · ${s.otl||0} DP` : `${s.g||0} B · ${s.a||0} P`;
      if(r.pts !== pts || r.stats !== stats){ r.pts = pts; r.stats = stats; maj++; }
    });
    if(maj){ save(); render(); }
    if(manual) toast(maj ? `🥅 Séries : ${maj} joueur(s) mis à jour` : "🥅 Séries : rien de nouveau");
    return maj;
  }catch(e){ if(manual) toast("Statistiques des séries indisponibles (hors ligne ?)"); return 0; }
}

/* ================== AI GHOST — 6e participant ==================
   Se bâtit une équipe avec les meilleurs agents libres restants, en respectant
   les règlements (25 joueurs, min 12A/6D/2G, plafond salarial). Les joueurs
   choisis RESTENT disponibles pour tout le monde : c'est une équipe fantôme. */
function ghostRoster(){ return (S.ghost && S.ghost.roster) || []; }
/* Les points du fantôme suivent la saison comme ceux de tout le monde :
   l'ALIGNEMENT est figé au repêchage, mais les statistiques restent vivantes. */
function ghostPtsActuels(p){
  const live = (S.faList||[]).find(x=>norm(x.name)===norm(p.name));
  if(live) return live.pts||0;              // statistiques du jour
  return p.pts||0;                          // sinon, la valeur du repêchage
}
function ghostCalc(){
  const ps = ghostRoster().map((p,i)=>Object.assign({id:"g"+i, pooler:GHOST}, p, {pts:ghostPtsActuels(p)}));
  const act = ps.filter(p=>!p.deap), deap = ps.filter(p=>p.deap);
  const by = c => act.filter(p=>p.pos===c).sort((a,b)=>(b.pts||0)-(a.pts||0));
  const F = by("F"), D = by("D"), G = by("G");
  const counted = new Set([...F.slice(0,12),...D.slice(0,6),...G.slice(0,2)].map(p=>p.id));
  let pts = 0; act.forEach(p=>{ if(counted.has(p.id)) pts += (p.pts||0); });
  const cap = act.reduce((t,p)=>t+(p.cap||0),0);
  return {F,D,G,deap,act,counted,pts,cap};
}
/* ================== BLESSURES ET SUSPENSIONS ==================
   Source : la page des blessures de PuckPedia (joueur · durée · statut · nature). */
const DUREE_FR = {"day to day":"Au jour le jour", "week to week":"De semaine en semaine",
  "month to month":"De mois en mois", "season":"Reste de la saison", "indefinite":"Indéterminée"};
const RAISON_FR = {"upper body":"Haut du corps","lower body":"Bas du corps","undisclosed":"Non divulguée",
  "knee":"Genou","hip":"Hanche","shoulder":"Épaule","ankle":"Cheville","wrist":"Poignet","hand":"Main",
  "foot":"Pied","back":"Dos","face":"Visage","leg":"Jambe","lower leg":"Bas de jambe","ribs":"Côtes",
  "abdomen":"Abdomen","heel":"Talon","achilles":"Tendon d'Achille","kneecap":"Rotule","illness":"Maladie",
  "personal":"Raisons personnelles","suspension":"Suspension","concussion":"Commotion","groin":"Aine"};
const fr = (map,v) => map[(v||"").toLowerCase().trim()] || (v||"");
/* Le statut est plus parlant que la « durée » : PuckPedia inscrit « Month to Month »
   presque partout, alors que IR / LTIR / SELTIR distinguent vraiment la gravité. */
const STATUT_FR = {"SELTIR":"Absent pour la saison", "LTIR":"Blessure à long terme",
  "IR":"Sur la liste des blessés", "OUT":"Absent", "DTD":"Au jour le jour"};
function dureeLisible(duree, statut){
  const s = (statut||"").toUpperCase();
  if(s==="SELTIR") return "Absent pour la saison";
  if(s==="LTIR")   return "Long terme (10 matchs et +)";
  const d = (duree||"").toLowerCase();
  if(d.includes("season")) return "Reste de la saison";
  if(s==="IR")     return "Liste des blessés (7 jours et +)";
  if(d.includes("day"))   return "Au jour le jour";
  if(d.includes("week"))  return "De semaine en semaine";
  if(d.includes("month")) return "De mois en mois";
  return fr(DUREE_FR, duree) || "Durée indéterminée";
}
function dateFR(x){ const d = (x instanceof Date) ? x : new Date(x); return isNaN(d) ? "" : d.toLocaleDateString("fr-CA",{day:"numeric",month:"long"}); }
/* Depuis quand le joueur est-il absent. La source ne datant pas les blessures,
   l'app note le jour où elle l'a vue apparaître pour la première fois. */
function depuisTexte(iso, exact){
  if(!iso) return "";
  const j = Math.floor((Date.now() - new Date(iso).getTime())/86400000);
  const d = dateFR(iso);
  const duree = j<=0 ? "aujourd'hui" : j===1 ? "hier" : j<7 ? `${j} jours` : j<60 ? `${Math.round(j/7)} semaines` : `${Math.round(j/30)} mois`;
  return (exact ? "Blessé depuis le " : "Signalé depuis le ") + d + (j>1 ? ` (${duree})` : "");
}
/* Part de saison perdue — sert à pondérer les projections */
function partManquee(duree, statut){
  const s = (statut||"").toUpperCase();
  if(s==="SELTIR") return 0.92;
  if(s==="LTIR")   return 0.55;
  const k = (duree||"").toLowerCase();
  if(k.includes("season")) return 0.90;
  if(s==="IR")     return 0.30;
  if(k.includes("month")) return 0.35;
  if(k.includes("week"))  return 0.15;
  if(k.includes("day"))   return 0.04;
  return 0.20;
}
async function fetchInjuries(manual){
  if(manual) toast("🚑 Blessures et suspensions…");
  try{
    const r = await fetch(PP_BASE + "/injuries");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const html = await r.text();
    const map = {};
    /* Lecture indépendante de la mise en page : pour chaque lien de joueur, on lit
       le texte qui suit et on y repère la durée, le statut et la nature. */
    const RE_DUREE  = /day\s*to\s*day|week\s*to\s*week|month\s*to\s*month|indefinite|season/i;
    const RE_STATUT = /\b(SELTIR|LTIR|IR|OUT|DTD)\b/;
    const liens = [...html.matchAll(/\/player\/([a-z0-9\-]+)"[^>]*>([\s\S]{0,240}?)<\/a>/gi)];
    liens.forEach((L, i)=>{
      let nom = txt(L[2]).replace(/&amp;/g,"&").trim();   // le nom peut être enrobé de balises
      if(!/[a-zA-Z]{2}/.test(nom) || nom.length > 60) return;
      if(nom.includes(",")){ const [a,b] = nom.split(","); nom = (b||"").trim()+" "+a.trim(); }
      // fenêtre de texte entre ce joueur et le suivant (bornée pour éviter les débordements)
      const debut = L.index + L[0].length;
      const fin = Math.min(liens[i+1] ? liens[i+1].index : html.length, debut + 900);
      const seg = txt(html.slice(debut, fin));
      const md = seg.match(RE_DUREE); if(!md) return;              // sans durée, ce n'est pas une ligne de blessure
      const ms = seg.match(RE_STATUT);
      // la nature est le libellé qui suit le statut (ou la durée)
      const apres = seg.slice((ms ? seg.indexOf(ms[0])+ms[0].length : md.index+md[0].length));
      let nature = (apres.match(/[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ' \-]{2,28}/) || [""])[0].trim();
      if(RE_DUREE.test(nature) || RE_STATUT.test(nature)) nature = "";
      const susp = /suspen/i.test(seg.slice(0, 300));
      const k = norm(nom);
      const ancien = (S.inj||{})[k];
      const depuis = (ancien && ancien.depuis) ? ancien.depuis : new Date().toISOString().slice(0,10);
      if(!map[k]) map[k] = {nom, duree:md[0], statut:(ms?ms[0]:""), nature, susp, slug:L[1], depuis};
    });
    if(Object.keys(map).length){
      S.inj = map; S.injDate = new Date().toISOString(); save(); render();
      if(manual) toast(`🚑 ${Object.keys(map).length} joueurs blessés ou suspendus`);
      return Object.keys(map).length;
    }
    if(manual) toast(`Page reçue (${Math.round(html.length/1000)} ko) mais aucune ligne lue — format inattendu`);
    return 0;
  }catch(e){ if(manual) toast("Blessures indisponibles — l'app doit être ouverte depuis le lien Netlify (https), pas en local"); return 0; }
}

/* État d'un joueur : blessure/suspension automatique, ou saisie manuelle (prioritaire) */
function statutOf(p){
  const man = p && p.statut;                       // saisi à la main par l'admin
  if(man && man.type){
    const d = man.depuisISO ? depuisTexte(man.depuisISO, true) : (man.duree || "");
    return {type:man.type, nature:man.nature, duree:d, manuel:true};
  }
  const a = (S.inj||{})[norm((p&&p.name)||"")];
  if(!a) return null;
  return {type: a.susp ? "susp" : "bless", nature: fr(RAISON_FR, a.nature),
          duree: depuisTexte(a.depuis),
          gravite: dureeLisible(a.duree, a.statut),
          brut:{duree:a.duree, statut:a.statut}};
}
function statutBadge(p, gros){
  const s = statutOf(p); if(!s) return "";
  const ic = s.type==="susp" ? "⚖️" : "✚";
  const t = `${s.type==="susp"?"Suspendu":"Blessé"}${s.nature?" · "+s.nature:""}${s.duree?" · "+s.duree:""}${s.gravite?" ("+s.gravite+")":""}`;
  const col = s.type==="susp" ? "var(--warn)" : "var(--bad)";
  return gros
    ? `<span class="badge" style="background:${s.type==="susp"?"#3a2c10":"#3d1a1a"};color:${col};margin-left:6px">${ic} ${esc(t)}</span>`
    : `<span title="${esc(t)}" onclick="event.stopPropagation();toast('${esc(t).replace(/'/g,"\\'")}')" style="color:${col};margin-left:5px;font-weight:900;cursor:help">${ic}</span>`;
}

/* Points PROJETÉS sur une saison complète.
   Un joueur blessé qui a produit 50 pts en 40 matchs vaut mieux qu'un autre à 50 pts en 82.
   Les petits échantillons sont ramenés vers la moyenne pour éviter les mirages. */
function projPts(p){
  const pts = p.pts||0, gp = p.gp||0;
  let base;
  if(p.rookie || gp <= 0) base = pts;         // espoir : la projection inscrite fait foi
  else {
    const PRIOR_GP = 18, PRIOR_PPG = 0.30;    // lest statistique
    base = (pts + PRIOR_PPG*PRIOR_GP) / (gp + PRIOR_GP) * 82;
  }
  // Un joueur blessé ou suspendu manquera des matchs : on escompte sa projection
  const s = statutOf(p);
  if(s) base *= (1 - partManquee(s.brut?s.brut.duree:s.duree, s.brut?s.brut.statut:""));
  return Math.round(base * 10) / 10;
}
/* Bâtit l'équipe : maximise les points PROJETÉS sous le plafond, en respectant les minimums */
function buildGhostFrom(pool, capMax){
  const need = {F:12, D:6, G:2}, TOTAL = 25;
  // maximums réalistes : au-delà, la profondeur ne sert plus à rien (seuls 2 gardiens comptent)
  const MAX = {F:16, D:10, G:3};
  const by = {F:[], D:[], G:[]};
  const seen = new Set();
  pool.forEach(p=>{                                   // un seul exemplaire par joueur
    const k = norm(p.name);
    if(!by[p.pos] || !(p.cap>0) || seen.has(k)) return;
    seen.add(k); by[p.pos].push(p);
  });
  if(by.F.length<12 || by.D.length<6 || by.G.length<2) return {roster:[], cap:0, err:"bassin insuffisant"};
  const V = p => projPts(p);                          // valeur = points projetés

  // 1) Socle garanti : alignement légal COMPLET (25 joueurs) au coût le plus bas possible
  const pick = new Map();                             // nom normalisé → joueur
  let cap = 0;
  const ajoute = p => { pick.set(norm(p.name), p); cap += p.cap; };
  ["F","D","G"].forEach(pos=>{
    [...by[pos]].sort((a,b)=>a.cap-b.cap).slice(0, need[pos]).forEach(ajoute);
  });
  // …puis les 5 places restantes, les moins chères toutes positions confondues
  const dispo = () => ["F","D","G"].reduce((l,pos)=>l.concat(by[pos].filter(p=>!pick.has(norm(p.name)))), []);
  for(const p of dispo().sort((a,b)=>a.cap-b.cap)){
    if(pick.size >= TOTAL) break;
    if([...pick.values()].filter(x=>x.pos===p.pos).length >= MAX[p.pos]) continue;
    ajoute(p);
  }
  if(pick.size < TOTAL) return {roster:[...pick.values()], cap, err:"pas assez de joueurs avec un salaire connu"};
  if(cap > capMax) return {roster:[...pick.values()], cap, err:"plafond trop bas même avec les 25 moins chers"};

  // 2) Améliorations : on remplace, position par position, le joueur qui rapporte le plus par dollar
  const has = p => pick.has(norm(p.name));
  /* Ne comptent au classement que les 12 meilleurs A, 6 D et 2 G : améliorer un joueur
     hors de ce groupe ne rapporte rien. On évalue donc le gain sur l'équipe RÉELLE. */
  const scoreEquipe = (liste) => {
    const t = (pos,n) => liste.filter(p=>p.pos===pos).sort((a,b)=>V(b)-V(a)).slice(0,n);
    return [...t("F",12), ...t("D",6), ...t("G",2)].reduce((s,p)=>s+V(p), 0);
  };
  const ameliorer = () => {
    for(let pass=0; pass<600; pass++){
      const courant = [...pick.values()];
      const base = scoreEquipe(courant);
      let best = null;
      ["F","D","G"].forEach(pos=>{
        const mine = courant.filter(p=>p.pos===pos);
        const peutChangerDePosition = mine.length > need[pos];
        mine.forEach(sortant=>{
          const cibles = peutChangerDePosition ? ["F","D","G"] : [pos];
          cibles.forEach(q=>{
            by[q].forEach(entrant=>{
              if(has(entrant)) return;
              const coutNet = entrant.cap - sortant.cap;
              if(cap + coutNet > capMax) return;
              if(q!==sortant.pos && courant.filter(x=>x.pos===q).length >= MAX[q]) return;
              const essai = courant.map(x=>x===sortant?entrant:x);
              const gain = scoreEquipe(essai) - base;
              if(gain <= 0.001) return;
              const eff = gain / Math.max(coutNet, 1);
              if(!best || eff > best.eff) best = {sortant, entrant, coutNet, eff};
            });
          });
        });
      });
      if(!best) return;
      pick.delete(norm(best.sortant.name));
      pick.set(norm(best.entrant.name), best.entrant);
      cap += best.coutNet;
    }
  };
  ameliorer();

  /* Phase profondeur : le budget qui reste ne sert à rien tel quel. On renforce le banc,
     car un blessé est remplacé par le meilleur réserviste — c'est de l'assurance. */
  const scoreTotal = liste => liste.reduce((s,p)=>s+V(p), 0);
  for(let pass=0; pass<400; pass++){
    const courant = [...pick.values()];
    const base20 = scoreEquipe(courant), baseTot = scoreTotal(courant);
    let best = null;
    ["F","D","G"].forEach(pos=>{
      const mine = courant.filter(p=>p.pos===pos);
      const peutChangerDePosition = mine.length > need[pos];
      mine.forEach(sortant=>{
        (peutChangerDePosition ? ["F","D","G"] : [pos]).forEach(q=>{
          by[q].forEach(entrant=>{
            if(has(entrant)) return;
            const coutNet = entrant.cap - sortant.cap;
            if(cap + coutNet > capMax) return;
            if(q!==sortant.pos && courant.filter(x=>x.pos===q).length >= MAX[q]) return;
            const essai = courant.map(x=>x===sortant?entrant:x);
            if(scoreEquipe(essai) < base20 - 0.001) return;   // ne jamais affaiblir l'alignement
            const gain = scoreTotal(essai) - baseTot;
            if(gain <= 0.001) return;
            if(!best || gain > best.gain) best = {sortant, entrant, coutNet, gain};
          });
        });
      });
    });
    if(!best) break;
    pick.delete(norm(best.sortant.name));
    pick.set(norm(best.entrant.name), best.entrant);
    cap += best.coutNet;
  }
  return {roster:[...pick.values()], cap};
}

let ghostBusy = false;
async function runGhost(){
  if(ghostBusy) return; ghostBusy = true;
  const prog = m => { const el=document.getElementById("ghProg"); if(el) el.innerHTML = m; };
  try{
    let pool = (typeof faFreeAgents==="function" ? faFreeAgents() : []).filter(p=>p.name && !p.rookie);
    if(!pool.length){ prog("⚠️ Aucun agent libre chargé. Va dans l'onglet Libres et touche « Charger »."); ghostBusy=false; return; }
    pool.sort((a,b)=>(b.pts||0)-(a.pts||0));
    // Il faut les salaires : on va les chercher pour les meilleurs candidats
    const need = {F:40, D:24, G:10}, cand = [];
    ["F","D","G"].forEach(pos=>{ cand.push(...pool.filter(p=>p.pos===pos).slice(0, need[pos])); });
    S.faCap = S.faCap || {};
    const manquants = cand.filter(p=>!faCapOf(p.name));
    for(let i=0;i<manquants.length;i++){
      const p = manquants[i];
      prog(`💰 Salaires ${i+1}/${manquants.length} — ${esc(p.name)}…`);
      try{ const c = await fetchCapFor(p); if(c) S.faCap[norm(p.name)] = c; }catch(e){}
      await new Promise(r=>setTimeout(r,320));
    }
    save();
    const avecCap = cand.map(p=>Object.assign({}, p, {cap:faCapOf(p.name)})).filter(p=>p.cap>0);
    if(avecCap.length < 25){ prog(`⚠️ Seulement ${avecCap.length} salaires connus — impossible de bâtir 25 joueurs. Réessaie une fois en ligne.`); ghostBusy=false; return; }
    prog("🧠 Construction de l'alignement…");
    const {roster, cap, err} = buildGhostFrom(avecCap, S.cap);
    if(err){ prog(`⚠️ ${err} — impossible de bâtir 25 joueurs légalement.`); ghostBusy=false; return; }
    S.ghost = S.ghost || {}; S.ghost.roster = roster; S.ghost.cap = cap;
    S.ghost.date = new Date().toISOString(); S.ghost.on = true; S.ghost.fige = true;
    save(); render();
    const t = ghostCalc();
    const compo = `${t.F.length}A / ${t.D.length}D / ${t.G.length}G`;
    prog(`✅ Équipe bâtie : <b>${roster.length} joueurs</b> (${compo}) · masse ${money(cap)} · <b>${fmtPts(t.pts)} pts</b>`);
    toast(`🤖 AI Ghost : ${fmtPts(t.pts)} pts avec ${money(cap)}`);
  }catch(e){ prog("⚠️ Échec : "+e.message); }
  ghostBusy = false;
}

/* ---- Agents libres ---- */
function snapPts(pos, s){ if(!s) return 0; if(pos==="F") return (s.g||0)+(s.a||0); if(pos==="D") return 1.5*((s.g||0)+(s.a||0)); return 3*(s.w||0)+2*(s.so||0)+(s.otl||0); }
function removedFreeAgents(){
  const out=[];
  PLAYERS_BASE.forEach((p,i)=>{ const o=S.over["b"+i]||{}; if(o.removed){ const q=Object.assign({},p,o);
    out.push({name:q.name,pos:q.pos,team:q.team||"",pts:snapPts(q.pos,q.snap),g:(q.snap&&q.snap.g)||0,a:(q.snap&&q.snap.a)||0,w:(q.snap&&q.snap.w)||0,so:(q.snap&&q.snap.so)||0,otl:(q.snap&&q.snap.otl)||0}); } });
  (S.added||[]).forEach(p=>{ if(p.removed) out.push({name:p.name,pos:p.pos,team:p.team||"",pts:0}); });
  return out;
}
function faFreeAgents(){
  const taken = new Set(allPlayers().map(p=>norm(p.name)));
  const base = (S.faList||[]).filter(p=>!taken.has(norm(p.name)));
  const seen = new Set(base.map(p=>norm(p.name)));
  const rk = (S.rookies||[]).map((p,ri)=>Object.assign({rookie:true, _ri:ri, pts:p.proj||0}, p))
    .filter(p=>!taken.has(norm(p.name)) && !seen.has(norm(p.name)));
  rk.forEach(p=>seen.add(norm(p.name)));
  const rm = removedFreeAgents().filter(p=>!taken.has(norm(p.name)) && !seen.has(norm(p.name)));
  return base.concat(rk).concat(rm);
}

  openModal(`<h3>${isNew?"Ajouter":"Modifier"} une recrue</h3><div class="sub">Espoir repêchable (agent libre)</div>

/* ---- Salaire automatique depuis PuckPedia (via le proxy, meilleur effort) ---- */
const PP_BASE = (location.protocol==="http:"||location.protocol==="https:") ? "/pp" : "https://puckpedia.com";
/* Saison en cours au sens des contrats (ex. « 2026-27 ») */
function capSeasonLabel(){
  const d = new Date(), y = d.getFullYear(), m = d.getMonth()+1;
  const s = m>=7 ? y : y-1;                      // année contractuelle : 1er juillet au 30 juin
  return s + "-" + String((s+1)%100).padStart(2,"0");
}
function txt(s){
  return s.replace(/<(script|style)[\s\S]*?<\/\1>/gi," ")
          .replace(/<[^>]*>/g," ")
          .replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&")
          .replace(/\s+/g," ");
}
function firstAmount(s){
  const m = s.match(/\$\s?([1-9]\d{0,2}(?:,\d{3}){1,2})(?!\d)/);
  if(!m) return 0;
  const n = parseInt(m[1].replace(/,/g,""));
  return (n>=500000 && n<=30000000) ? n : 0;
}
function extractCap(html){
  const season = capSeasonLabel();               // ex. "2026-27"
  const t = txt(html);                           // on travaille sur le TEXTE de la page, pas le HTML brut
  // 1) Bloc « Current Contract » : le cap hit de l'année en cours, avant tout « Next Contract »
  let i = t.search(/current\s*contract/i);
  if(i>=0){
    let seg = t.slice(i, i+900);
    const nx = seg.search(/next\s*(contract|cap\s*hit)/i);
    if(nx>0) seg = seg.slice(0, nx);             // ne jamais déborder sur le contrat suivant
    const ch = seg.search(/cap\s*hit/i);
    const n = firstAmount(ch>=0 ? seg.slice(ch) : seg);
    if(n) return n;
  }
  // 2) Phrase de synthèse : « …with a cap hit of $12,500,000 per season »
  let m = t.match(/cap\s*hit\s*of\s*\$\s?([1-9]\d{0,2}(?:,\d{3}){1,2})/i);
  if(m){ const n = parseInt(m[1].replace(/,/g,"")); if(n>=500000 && n<=30000000) return n; }
  // 3) Colonne de la saison en cours dans le tableau des montants
  const si = t.indexOf(season);
  if(si>=0){
    const seg = t.slice(Math.max(0,si-400), si+400);
    const ch = seg.search(/cap\s*hit/i);
    if(ch>=0){ const n = firstAmount(seg.slice(ch)); if(n) return n; }
  }
  // 4) Données structurées, en excluant tout ce qui est « next »
  m = html.match(/"cap[_ ]?hit"\s*:\s*"?\$?\s*([\d.,]{5,})/i) || html.match(/"aav"\s*:\s*"?\$?\s*([\d.,]{5,})/i);
  if(m && !/next/i.test(html.slice(Math.max(0,m.index-60), m.index))){
    const n = parseInt(m[1].replace(/[^\d]/g,"")); if(n>=500000 && n<=30000000) return n;
  }
  // 5) Bloc de signature (« 2yrs '28 $12,500,000 Cap Hit ») — le plus récent en tête
  m = t.match(/\$\s?([1-9]\d{0,2}(?:,\d{3}){1,2})\s*Cap\s*Hit/i);
  if(m){ const n = parseInt(m[1].replace(/,/g,"")); if(n>=500000 && n<=30000000) return n; }
  // 6) Dernier recours : premier « cap hit » du texte
  const j = t.search(/cap\s*hit/i);
  if(j>=0){ const n = firstAmount(t.slice(j, j+200)); if(n) return n; }
  return 0;
}
async function fetchSalaryInto(name, salId){
  const el = document.getElementById(salId); if(!el || !name) return;
  const url = PP_BASE + "/player/" + slugify(name);
  toast("🔎 Recherche du salaire…");
  try{
    const r = await fetch(url); if(!r.ok) throw new Error("HTTP "+r.status);
    const html = await r.text();
    const cap = extractCap(html);
    if(cap){ el.value = cap; toast("💰 Salaire trouvé : "+money(cap)); }
    else toast("Salaire introuvable sur PuckPedia — inscris-le à la main");

}

function ppSlug(p){
  if(p.ppUrl && p.ppUrl.includes("/player/")) return p.ppUrl.split("/player/")[1].replace(/\/+$/,"");
  return slugify(p.name||"");
}
/* Variantes de slug PuckPedia (les noms composés/accentués diffèrent parfois) */
function slugVariants(p){
  const out = [];
  const push = s => { s = (s||"").replace(/\/+$/,""); if(s && out.indexOf(s)<0) out.push(s); };
  if(p.ppUrl && p.ppUrl.includes("/player/")) push(p.ppUrl.split("/player/")[1]);
  const nm = p.name||"";
  push(slugify(nm));                                   // forme normale
  push(slugify(nm.replace(/[.']/g,"")));               // J.T. Miller → jt-miller
  push(slugify(nm.replace(/[.']/g," ")));              // O'Reilly → o reilly
  push(slugify(nm).replace(/-/g,""));                  // sans tirets
  return out;
}
/* Demande à PuckPedia l'adresse exacte du joueur (gère Mitch/Mitchell, JJ, surnoms, accents) */
async function ppSearchSlug(name){
  const tries = [name];
  const parts = (name||"").trim().split(/\s+/);
  if(parts.length>1) tries.push(parts[parts.length-1]);            // nom de famille seul
  for(const q of tries){
    try{
      const r = await fetch(PP_BASE + "/search?q=" + encodeURIComponent(q));
      if(!r.ok) continue;
      const html = await r.text();
      const links = [...html.matchAll(/\/player\/([a-z0-9\-]+)/gi)].map(m=>m[1]);
      if(!links.length) continue;
      const want = norm(name).replace(/\s+/g,"-");
      const ln = norm(parts[parts.length-1]||"").replace(/\s+/g,"-");
      // priorité : correspondance exacte, puis même nom de famille, puis premier résultat
      return links.find(s=>s===want) || links.find(s=>s.endsWith("-"+ln)) || links[0];
    }catch(e){}
  }
  return null;
}
async function fetchCapFor(p){
  const key = norm(p.name||"");
  S.ppSlug = S.ppSlug || {};
  const slugs = slugVariants(p);
  if(S.ppSlug[key]) slugs.unshift(S.ppSlug[key]);                  // adresse déjà résolue
  let lastErr = null;
  const tryOne = async slug => {
    const r = await fetch(PP_BASE + "/player/" + slug);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return extractCap(await r.text());
  };
  for(const slug of slugs){
    try{ const cap = await tryOne(slug); if(cap){ S.ppSlug[key] = slug; return cap; } lastErr = new Error("montant introuvable"); }
    catch(e){ lastErr = e; }
  }
  // dernier recours : la recherche de PuckPedia
  try{
    const found = await ppSearchSlug(p.name);
    if(found && slugs.indexOf(found)<0){
      const cap = await tryOne(found);
      if(cap){ S.ppSlug[key] = found; return cap; }
    }
  }catch(e){ lastErr = e; }
  if(lastErr && /Failed|NetworkError|CORS/i.test(lastErr.message)) throw lastErr;
  return 0;
}

async function runRefreshSalaries(){
  if(rsRunning) return; rsRunning = true;
  const go = document.getElementById("rsGo"); if(go) go.style.display = "none";
  const ps = allPlayers().filter(p=>p.name);
  const fas = topFreeAgents(150);
  const tot = ps.length + fas.length;
  let upd = 0, same = 0, updFa = 0; const fail = [];
  S.faCap = S.faCap || {};
  for(let i=0; i<tot; i++){
    const bg = document.getElementById("modalBg");
    if(!bg || !bg.classList.contains("show")) break; // fenêtre fermée → on interrompt

}
