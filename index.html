  /* ===== Choix (ballottage / repêchage / étoiles) — avec joueurs laissés ===== */
  h += `<div class="sec"><h2>🎯 Choix — années antérieures</h2></div><div class="accordion">`;
  allDraftBlocks().forEach((bloc)=>{
    if(isDraftEditable(bloc) && !draftFilled(bloc)) return; // encore actif -> onglet Choix
    const draft = isDraftBlock(bloc.titre);
    const done = isDraftEditable(bloc); // bloc de repêchage rempli
    h += `<div class="acc-h" onclick="this.classList.toggle('open')"><span>${esc(bloc.titre)}${done?' <span style="color:var(--ok);font-size:11px">✓ rempli</span>':''}</span><span style="color:var(--dim)">▾</span></div><div class="acc-b">`;
    bloc.rondes.forEach(r=>{
      h += `<div class="tradecard"><div class="tt">Ronde ${r.n}</div>`+
        r.picks.map((pk,j)=>{ const rec = done ? S.picks[draftKey(bloc,r.n,j)] : null; const who = rec?rec.team:poolerOf(pk);
          const sel = rec?` → <b>${esc(rec.inName)}</b>${rec.outName?" · laissé "+esc(rec.outName):""} (${esc(rec.team)})`:"";
          return `<div class="teamtile" style="font-size:12.5px;padding:4px 6px;border-bottom:1px dashed rgba(255,255,255,.08);${who?'--tg:'+pTint(who)+';border-left:4px solid '+pBorder(who)+';border-radius:8px;margin-bottom:2px':''}">${j+1}. ${esc(pk)}${sel}</div>`;
        }).join("");
      if(draft){
        const key = bloc.titre+"|"+r.n;
        const left = (S.leftPlayers||{})[key];
        h += `<div ${S.admin?`onclick="openLeft('${esc(bloc.titre)}',${r.n})" style="cursor:pointer"`:""} style="margin-top:6px;padding:6px 8px;border-radius:8px;background:rgba(255,107,107,.10);border:1px solid rgba(255,107,107,.25);font-size:12px">
          <b style="color:var(--bad)">Laissés :</b> ${left?esc(left):`<span style="color:var(--dim)">${S.admin?"touche pour ajouter":"—"}</span>`}</div>`;
      }
      h += `</div>`;
    });
    h += `</div>`;
  });
  h += `</div><div class="sec"><h2>🔄 Échanges — saisons antérieures</h2></div><div class="accordion">`;
  TRADES.forEach((saison)=>{
    h += `<div class="acc-h" onclick="this.classList.toggle('open')"><span>${esc(saison.titre)} <span style="color:var(--dim);font-size:11px">(${saison.trades.length})</span></span><span style="color:var(--dim)">▾</span></div><div class="acc-b">`;
    saison.trades.forEach(tr=>{
      const wa=poolerOf(tr.a), wb=poolerOf(tr.b);
      h += `<div class="tradecard"><div class="tt">${esc(tr.titre.replace(/^TRADE/i,"ÉCHANGE"))}</div>
        <div class="tradecols">
          <div class="side" style="${wa?'border-left:4px solid '+pBorder(wa):''}"><div class="h" style="${wa?'color:'+pSolid(wa):''}">${esc(tr.a)}</div>${tr.itemsA.map(x=>`<div class="it">${esc(x)}</div>`).join("")||"<div class='it'>—</div>"}</div>
          <div class="vs">VS</div>
          <div class="side" style="${wb?'border-left:4px solid '+pBorder(wb):''}"><div class="h" style="${wb?'color:'+pSolid(wb):''}">${esc(tr.b)}</div>${tr.itemsB.map(x=>`<div class="it">${esc(x)}</div>`).join("")||"<div class='it'>—</div>"}</div>
        </div></div>`;
    });
    h += `</div>`;
  });
  h += `</div>`;
  return h;
}

    const blob = new Blob([html], {type:"text/html"});
    const file = new File([blob], "POOL_150M.html", {type:"text/html"});

      navigator.share({files:[file], title:"POOL TSÉ..."}).catch(()=>{});
      return;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "POOL_150M.html";

    openModal(`<h3>📤 Partage</h3>

  }catch(e){ toast("Erreur de partage: "+e.message); }

/* Équipe LNH actuelle d'un joueur du pool */
function equipeLNH(p){
  const s = statOf(p)||{};
  return ((s.team||p.team||"").split(/[,\s]+/).filter(Boolean).pop()||"").toUpperCase();
}
/* Qui joue ce soir, par pooler */
function joueursCeSoir(){
  const g = (S.score&&S.score.games)||[];
  const equipes = new Set();
  g.forEach(x=>{ if(x.awayTeam) equipes.add(x.awayTeam.abbrev); if(x.homeTeam) equipes.add(x.homeTeam.abbrev); });
  const par = {};
  POOLERS.forEach(pl=>{
    const t = teamCalc(pl);
    par[pl] = t.act.filter(p=>equipes.has(equipeLNH(p)));
  });
  return {par, equipes};
}
/* Buts marqués ce soir par des joueurs du pool */
function butsDuPool(){
  const g = (S.score&&S.score.games)||[];
  const tous = [];
  POOLERS.forEach(pl=>teamCalc(pl).act.forEach(p=>tous.push({nom:norm(p.name), pooler:pl})));
  const idx = {}; tous.forEach(x=>idx[x.nom]=x.pooler);
  const out = [];
  g.forEach(x=>(x.goals||[]).forEach(b=>{
    const nomComplet = ((b.firstName&&b.firstName.default)||"")+" "+((b.lastName&&b.lastName.default)||"");
    const k = norm(nomComplet);
    if(idx[k]) out.push({joueur:nomComplet.trim(), pooler:idx[k], type:"but", equipe:b.teamAbbrev});
    (b.assists||[]).forEach(a=>{
      const na = (a.name&&a.name.default)||"";
      // les passes ne donnent que l'initiale : on cherche par nom de famille
      const fam = norm(na.split(".").pop());
      const cible = tous.find(t=>t.nom.endsWith(" "+fam));
      if(cible) out.push({joueur:na, pooler:cible.pooler, type:"passe", equipe:b.teamAbbrev});
    });
  }));
  return out;
}

/* ================== ÉVOLUTION ET FACE-À-FACE ==================
   Reconstitué à partir des instantanés quotidiens conservés par l'app. */
function totauxParJour(){
  const jours = [];
  (S.hist||[]).forEach(h=>{
    const t = {};
    POOLERS.forEach(pl=>{
      const ps = (pl===GHOST ? ghostRoster().map((p,i)=>Object.assign({id:"g"+i},p))
                             : allPlayers().filter(p=>p.pooler===pl)).filter(p=>!p.deap);
      const by = c => ps.filter(p=>p.pos===c)
        .map(p=>({p, v:(h.pts[p.id]!=null?h.pts[p.id]:0)}))
        .sort((a,b)=>b.v-a.v);
      const cnt = [...by("F").slice(0,12), ...by("D").slice(0,6), ...by("G").slice(0,2)];
      t[pl] = cnt.reduce((s,x)=>s+x.v, 0);
    });
    jours.push({d:h.d, t});
  });
  return jours;
}
function statsEvolution(){
  const jours = totauxParJour();
  const res = {};
  POOLERS.forEach(pl=> res[pl] = {jours1er:0, meilleureSem:null, pireSem:null, rangs:[]});
  jours.forEach(j=>{
    const ordre = Object.entries(j.t).sort((a,b)=>b[1]-a[1]);
    ordre.forEach(([pl], i)=>{ if(res[pl]) res[pl].rangs.push(i+1); });
    if(ordre.length && res[ordre[0][0]]) res[ordre[0][0]].jours1er++;
  });
  // meilleure et pire semaine (fenêtres de 7 jours)
  POOLERS.forEach(pl=>{
    for(let i=7; i<jours.length; i++){
      const gain = (jours[i].t[pl]||0) - (jours[i-7].t[pl]||0);
      const r = res[pl];
      if(r.meilleureSem==null || gain > r.meilleureSem.g) r.meilleureSem = {g:gain, d:jours[i].d};
      if(r.pireSem==null || gain < r.pireSem.g) r.pireSem = {g:gain, d:jours[i].d};
    }
  });
  return {jours, res};
}
function graphEvolution(jours){
  if(jours.length < 2) return "";
  const W = 640, H = 190, pad = 8;
  const vals = [];
  jours.forEach(j=>POOLERS.forEach(pl=>vals.push(j.t[pl]||0)));
  const mn = Math.min(...vals), mx = Math.max(...vals), amp = Math.max(1, mx-mn);
  const x = i => pad + i*(W-2*pad)/(jours.length-1);
  const y = v => H-pad - ((v-mn)/amp)*(H-2*pad);
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">`;
  POOLERS.forEach(pl=>{
    const pts = jours.map((j,i)=>`${x(i).toFixed(1)},${y(j.t[pl]||0).toFixed(1)}`).join(" ");
    const c = pl===GHOST ? "#8f9bb3" : (PRGB[pl] ? `rgb(${PRGB[pl]})` : "#3d8bff");
    svg += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"${pl===GHOST?' stroke-dasharray="5 4"':''}/>`;
    const last = jours[jours.length-1];
    svg += `<circle cx="${x(jours.length-1).toFixed(1)}" cy="${y(last.t[pl]||0).toFixed(1)}" r="3.5" fill="${c}"/>`;
  });
  svg += `</svg>`;
  const leg = POOLERS.map(pl=>{
    const c = pl===GHOST ? "#8f9bb3" : (PRGB[pl] ? `rgb(${PRGB[pl]})` : "#3d8bff");
    return `<span style="font-size:11px;color:var(--dim);margin-right:10px;white-space:nowrap"><span style="display:inline-block;width:10px;height:3px;background:${c};vertical-align:middle;margin-right:4px"></span>${esc(pl)}</span>`;
  }).join("");
  return `<div class="card" style="padding:10px">${svg}<div style="margin-top:6px">${leg}</div>
    <div class="note">Du ${jours[0].d} à aujourd'hui · ${jours.length} jours</div></div>`;
}
function vEvolution(){
  const {jours, res} = statsEvolution();
  if(jours.length < 2) return `<div class="empty">L'évolution s'affichera après quelques jours.<br>L'app enregistre un instantané chaque jour.</div>`;
  let h = `<div class="sec"><h2>Évolution du classement</h2></div>` + graphEvolution(jours);

  POOLERS.forEach(pl=>{

function ageTexte(iso){
  if(!iso) return {txt:"jamais", vieux:true};
  const h = (Date.now()-new Date(iso).getTime())/3600000;
  if(h < 1)  return {txt:"il y a "+Math.max(1,Math.round(h*60))+" min", vieux:false};
  if(h < 48) return {txt:"il y a "+Math.round(h)+" h", vieux:false};
  const j = Math.round(h/24);
  return {txt:"il y a "+j+" jours", vieux:j>10};
}

  try{ await refreshStats(false); }catch(e){}
  try{ await fetchInjuries(false); }catch(e){}
  try{ await refreshBracket(false); }catch(e){}
  try{ await refreshPlayoffs(false); }catch(e){}
  try{ await warmPids(false); }catch(e){}
  save(); render(); closeModal();
  toast("✅ Tout est à jour");
}
/* Entre-saison : de la fin des séries au début de la saison régulière.
   Le plafond n'est exigé qu'au camp; les dépassements sont tolérés d'ici là. */
function entreSaison(){
  const m = new Date().getMonth()+1;
  return m>=7 && m<=9;              // juillet, août, septembre
}
/* Alertes de règlements : l'app surveille et prévient, sans rien imposer */
function alertesReglements(){
  const out = [];
  const hors = entreSaison();
  POOLERS_BASE.forEach(p=>{
    const t = teamCalc(p);
    if(!hors){
      if(t.act.length !== 25) out.push(`${p} : ${t.act.length} joueurs actifs (25 requis)`);
      if(t.F.length < 12) out.push(`${p} : ${t.F.length} attaquants (12 minimum)`);
      if(t.D.length < 6)  out.push(`${p} : ${t.D.length} défenseurs (6 minimum)`);
      if(t.G.length < 2)  out.push(`${p} : ${t.G.length} gardiens (2 minimum)`);
      if(t.cap > S.cap)   out.push(`${p} : dépassement du plafond de ${money(t.cap - S.cap)}`);
    }
    if(t.deap.length > 5) out.push(`${p} : ${t.deap.length} recrues (5 maximum)`);
    // Règle du 50e match : une recrue qui a assez joué doit monter
    t.deap.forEach(j=>{
      const s = statOf(j); const gp = (s&&s.gp)||0;
      const seuil = j.pos==="G" ? 25 : 50;
      if(gp >= seuil) out.push(`${p} : ${j.name} a ${gp} matchs — doit monter dans l'alignement (règle du ${seuil}e match)`);
    });
  });
  return out;
}
function bandeauAlertes(){
  const a = alertesReglements();
  if(entreSaison()){
    const sur = POOLERS_BASE.map(p=>({p, d:teamCalc(p).cap - S.cap})).filter(x=>x.d>0);
    const info = sur.length
      ? `<div class="note" style="margin-top:4px">Dépassements tolérés d'ici le camp : ${sur.map(x=>esc(x.p)+" +"+money(x.d)).join(" · ")}</div>`
      : `<div class="note" style="margin-top:4px">Toutes les équipes sont déjà sous le plafond.</div>`;
    const bloc = `<div class="card" style="padding:10px 12px;border-left:4px solid var(--acc)">
      <div style="font-weight:800;color:var(--acc);font-size:13px">☀️ Entre-saison</div>
      ${info}</div>`;
    return bloc + (a.length ? `<div class="card" style="padding:10px 12px;border-left:4px solid var(--warn)">
      <div style="font-weight:800;color:var(--warn);font-size:13px">⚠️ ${a.length} point${a.length>1?"s":""} à régler</div>
      <div class="note" style="margin-top:4px">${a.map(esc).join("<br>")}</div></div>` : "");
  }
  if(!a.length) return "";
  return `<div class="card" style="padding:10px 12px;border-left:4px solid var(--warn)">
    <div style="font-weight:800;color:var(--warn);font-size:13px">⚠️ ${a.length} point${a.length>1?"s":""} à régler</div>
    <div class="note" style="margin-top:4px">${a.map(esc).join("<br>")}</div></div>`;
}

function injIfDue(){
  const vide = !S.inj || !Object.keys(S.inj).length;
  const age = S.injDate ? (Date.now()-new Date(S.injDate).getTime())/3600000 : Infinity;
  if(vide || age > 6) fetchInjuries(false);      // tout de suite si rien, sinon aux 6 heures
}
setTimeout(injIfDue, 2500);
setInterval(injIfDue, 60*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) injIfDue(); });
/* Matchs du jour : rafraîchis souvent en soirée, et à chaque retour dans l'app */
function scoreIfDue(){
  const jour = (S.score&&S.score.date)||"";
  const age = S.scoreDate ? (Date.now()-new Date(S.scoreDate).getTime())/60000 : Infinity;
  const hh = new Date().getHours();
  const seuil = (hh>=18 || hh<2) ? 5 : 60;      // aux 5 min en soirée, sinon à l'heure
  if(jour !== dISO() || age > seuil) fetchScore();
}
setTimeout(scoreIfDue, 4000);
setInterval(scoreIfDue, 5*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) scoreIfDue(); });
setTimeout(refreshSeriesIfDue, 3000);
setInterval(refreshSeriesIfDue, 30*60*1000);
setInterval(()=>{ pullSync(); }, 90*1000);
setInterval(()=>{ refreshIfStale(10); }, 5*60*1000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ refreshIfStale(10); pullSync(); } });
window.addEventListener("hashchange", ()=>{ if(handleSyncHash()){ pullSync(); render(); } });
</script>
